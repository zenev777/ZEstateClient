<div style="position: relative;">
  <button type="button" class="app-header-action" aria-label="Известия" (click)="toggle()" style="position: relative;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    @if (unreadCount() > 0) {
      <span
        style="position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--color-danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; line-height: 1;"
      >
        {{ unreadCount() > 9 ? '9+' : unreadCount() }}
      </span>
    }
  </button>

  @if (open()) {
    <div
      class="card"
      style="position: absolute; top: calc(100% + 6px); right: 0; width: 300px; max-height: 360px; overflow-y: auto; z-index: 100; padding: 0;"
    >
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--color-border);">
        <span style="font-weight: 600; font-size: 13.5px;">Известия</span>
        @if (unreadCount() > 0) {
          <button type="button" class="btn btn-secondary btn-sm" (click)="markAllAsRead()">Всички прочетени</button>
        }
      </div>

      @if (loading()) {
        <p class="text-muted" style="text-align: center; padding: 16px 0;">Зареждане…</p>
      } @else if (notifications().length === 0) {
        <p class="text-muted" style="text-align: center; padding: 16px 0;">Нямаш известия.</p>
      } @else {
        @for (item of notifications(); track item.id) {
          <button
            type="button"
            (click)="openNotification(item)"
            style="display: block; width: 100%; text-align: left; padding: 10px 12px; border: none; border-bottom: 1px solid var(--color-border); background: none; cursor: pointer;"
            [style.background]="item.isRead ? 'none' : 'var(--color-icon-bg)'"
          >
            <div style="font-weight: 600; font-size: 13px; color: var(--color-text);">{{ item.title }}</div>
            <div class="card-meta" style="margin-top: 2px;">{{ item.message }}</div>
            <div class="card-meta" style="margin-top: 4px; font-size: 11px;">{{ item.createdAt | date: 'dd.MM.yyyy HH:mm' }}</div>
          </button>
        }
      }

      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-top: 1px solid var(--color-border);">
        <span class="card-meta">Известия по имейл</span>
        <label class="toggle">
          <input type="checkbox" [checked]="emailEnabled()" (change)="toggleEmailPreference()" />
          <span class="track"></span>
        </label>
      </div>
    </div>
  }
</div>
