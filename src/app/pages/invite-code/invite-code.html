<div class="page-shell">
  <div class="page-frame">
    <div class="brand">
      <div class="app-logo" style="width: 32px; height: 32px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
          <path d="M10 6h4M10 10h4M10 14h4M10 18h4"></path>
        </svg>
      </div>
      ZEstate
    </div>
    <h2 style="margin-bottom: 16px;">Вход</h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      @if (loginError()) {
        <div class="alert alert-error" style="margin-bottom: 12px;">{{ loginError() }}</div>
      }

      <div class="field" [class.has-error]="loginForm.controls.email.invalid && loginForm.controls.email.touched">
        <label for="email">Имейл</label>
        <input id="email" class="input" type="email" formControlName="email" placeholder="ivan.petrov@email.bg" />
      </div>
      <div class="field" [class.has-error]="loginForm.controls.password.invalid && loginForm.controls.password.touched">
        <label for="password">Парола</label>
        <input id="password" class="input" type="password" formControlName="password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="loggingIn()">
        {{ loggingIn() ? 'Влизане…' : 'Вход' }}
      </button>
    </form>

    <div class="hr"></div>

    <div>
      <p style="font-size: 13px; margin: 0 0 6px;">Нямаш акаунт, но имаш код за сграда?</p>

      @if (errorMessage()) {
        <div class="alert alert-error" style="margin-bottom: 10px;">{{ errorMessage() }}</div>
      }

      <div style="display: flex; gap: 8px;">
        <input
          class="input"
          style="flex: 1; text-transform: uppercase;"
          placeholder="K7P2XQ"
          [(ngModel)]="code"
          (keyup.enter)="checkCode()"
        />
        <button type="button" class="btn btn-secondary" [disabled]="checking()" (click)="checkCode()">
          {{ checking() ? 'Проверка…' : 'Провери код' }}
        </button>
      </div>
    </div>

    <p style="font-size: 13px; text-align: center; margin: 16px 0 0;">
      Искаш да управляваш сграда? <a routerLink="/register/manager">Регистрирай се като домоуправител</a>
    </p>
  </div>
</div>
