<div class="page-shell">
  <div class="page-frame">
    <div class="brand">ZEstate</div>
    <h2 style="margin-bottom: 4px;">Нова заявка</h2>
    <p class="text-muted" style="margin: 0 0 20px;">
      Провери отново кода и данните за апартамента, преди да изпратиш заявката.
    </p>

    @if (!building()) {
      @if (codeError()) {
        <div class="alert alert-error" style="margin-bottom: 12px;">{{ codeError() }}</div>
      }
      <div class="field">
        <label for="code">Код на сграда</label>
        <div style="display: flex; gap: 8px;">
          <input
            id="code"
            class="input"
            style="flex: 1; text-transform: uppercase;"
            [formControl]="codeControl"
            placeholder="K7P2XQ"
            (keyup.enter)="checkCode()"
          />
          <button type="button" class="btn btn-secondary" [disabled]="checkingCode()" (click)="checkCode()">
            {{ checkingCode() ? 'Проверка…' : 'Провери код' }}
          </button>
        </div>
      </div>
    } @else {
      <div class="card" style="margin-bottom: 16px;">
        <span class="tag tag-accent">Код валиден</span>
        <p style="margin: 0; font-size: 13.5px;">{{ building()!.name }} — {{ building()!.address }}</p>
      </div>

      @if (submitError()) {
        <div class="alert alert-error" style="margin-bottom: 16px;">{{ submitError() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field" [class.has-error]="form.controls.apartmentNumber.invalid && form.controls.apartmentNumber.touched">
          <label for="apartmentNumber">Апартамент №</label>
          <input id="apartmentNumber" class="input" formControlName="apartmentNumber" placeholder="12" />
        </div>

        <div class="field">
          <label>Статут</label>
          <div style="display: flex; gap: 16px;">
            <label class="radio">
              <input type="radio" [checked]="form.controls.status.value === 'Owner'" (change)="setStatus('Owner')" />
              <span class="dot"></span>Собственик
            </label>
            <label class="radio">
              <input type="radio" [checked]="form.controls.status.value === 'Resident'" (change)="setStatus('Resident')" />
              <span class="dot"></span>Живущ (наемател)
            </label>
          </div>
        </div>

        <div class="field">
          <label for="notes">Бележка (по избор)</label>
          <textarea id="notes" class="input" rows="3" formControlName="notes"
                    placeholder="Допълнителна информация за домоуправителя…"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
          {{ submitting() ? 'Изпращане…' : 'Изпрати заявка' }}
        </button>
      </form>
    }
  </div>
</div>
